# GraphQL input types for mutations **only**.
input BoxCreationInput {
  productId: Int!
  sizeId: Int
  weight: Float
  monetaryValue: Float
  displayUnitId: Int
  measureValue: Float
  numberOfItems: Int
  locationId: Int!
  comment: String
  qrCode: String
  tagIds: [Int!]
  " Names of new tags to be created on-the-fly "
  newTagNames: [String!]
}

input BoxUpdateInput {
  labelIdentifier: String!
  productId: Int
  sizeId: Int
  weight: Float
  monetaryValue: Float
  displayUnitId: Int
  measureValue: Float
  numberOfItems: Int
  locationId: Int
  comment: String
  state: BoxState
  " List of all tags that shall be assigned to the box. Any requested tags already assigned to the box will not be assigned again "
  tagIds: [Int!]
  " Names of new tags to be created on-the-fly "
  newTagNames: [String!]
}

input MarkedForShipmentBoxUpdateInput {
  labelIdentifier: String!
  weight: Float
  monetaryValue: Float
}

input BoxFromBoxCreationInput {
  sourceBoxLabelIdentifier: String!
  numberOfItems: Int!
  locationId: Int!
}

input BoxMoveInput {
  " Specify either label identifiers OR filters to find boxes to move "
  labelIdentifiers: [String!]
  filters: FilterBoxInput
  locationId: Int!
}

input BoxesTagsOperationInput {
  " Specify either label identifiers OR filters to find boxes to (un)assign tags to/from "
  labelIdentifiers: [String!]
  filters: FilterBoxInput
  tagIds: [Int!]!
}

input BoxBulkCreationInput {
  productId: Int!
  " Name of discrete size (XL, Size 4, 39, ...); or measure (1.5kg, 300ml, ...) "
  sizeName: String!
  numberOfItems: Int
  locationId: Int!
  comment: String
  tagIds: [Int!]
  newTagNames: [String!]
  " If set, add numberOfItems to the existing box with this label identifier instead of creating a new box. Other BoxBulkCreationInput fields are ignored "
  boxLabelIdentifierForMerge: String
}

input BeneficiariesTagsOperationInput {
  ids: [Int!]!
  tagIds: [Int!]!
}

input BeneficiariesServicesOperationInput {
  ids: [Int!]!
  serviceIds: [Int!]!
}

input CustomProductCreationInput {
  name: String!
  categoryId: Int!
  sizeRangeId: Int!
  gender: ProductGender!
  baseId: Int!
  price: Int
  comment: String
  inShop: Boolean
}

input CustomProductEditInput {
  id: ID!
  name: String
  categoryId: Int
  sizeRangeId: Int
  gender: ProductGender
  price: Int
  comment: String
  inShop: Boolean
}

input StandardProductEnableInput {
  standardProductId: Int!
  sizeRangeId: Int
  baseId: Int!
  price: Int
  comment: String
  inShop: Boolean
}

input StandardProductsEnableInput {
  standardProductIds: [Int!]!
  baseId: Int!
}

input StandardProductInstantiationEditInput {
  id: ID!
  sizeRangeId: Int
  price: Int
  comment: String
  inShop: Boolean
}

input BeneficiaryCreationInput {
  firstName: String!
  lastName: String!
  baseId: Int!
  groupIdentifier: String!
  " Default: null. The resulting age is also null. "
  dateOfBirth: Date
  comment: String
  " Default: null "
  gender: HumanGender
  languages: [Language!]
  familyHeadId: Int
  " Default: false "
  isVolunteer: Boolean
  " Default: true "
  registered: Boolean
  signature: String
  tagIds: [Int!]
  " If the beneficiary is a family member, this is attributed with the family head. 0 is silently ignored. "
  initialCredit: Int
  email: String
  phoneNumber: String
  customTextField1: String
  customTextField2: String
  customNumberField: Int
  customDateField: Date
}

input BeneficiaryUpdateInput {
  id: ID!
  firstName: String
  lastName: String
  groupIdentifier: String
  dateOfBirth: Date
  comment: String
  gender: HumanGender
  languages: [Language!]
  " If the beneficiary didn't belong to a family before, all their credit is transferred to the new family head. Passing null resets (i.e. makes the beneficiary an individual). Pass the current family head ID if it should be kept "
  familyHeadId: Int
  isVolunteer: Boolean
  registered: Boolean
  signature: String
  " Pass full set of assigned tags (internally, old and new tag sets are compared, removed tags are unassigned, and only added ones are assigned). Passing an empty list unassigns all tags, passing null ignores tag updates. "
  tagIds: [Int!]
  email: String
  phoneNumber: String
  customTextField1: String
  customTextField2: String
  customNumberField: Int
  customDateField: Date
}

input BeneficiariesCreationInput {
  baseId: Int!
  beneficiaryData: [BeneficiaryBulkCreationInput!]!
}

input BeneficiaryBulkCreationInput {
  firstName: String!
  lastName: String
  groupIdentifier: String!
  dateOfBirth: Date
  comment: String
  gender: HumanGender
  languages: [Language!]
  familyHeadId: Int
  phoneNumber: String
  isVolunteer: Boolean
  registered: Boolean
  tagIds: [Int!]
}

input BeneficiariesAdjustCreditInput {
  baseId: Int!
  " Adjust credit for the families of the given heads in the given base. Passing null means adjusting credit for all active members of families in the base. "
  familyHeadIds: [Int!]
  " Non-negative credit for each adult (age greater or equal than ``Base.adultAge``) "
  creditPerAdult: Int!
  " Non-negative credit for each child (age smaller than ``Base.adultAge``) "
  creditPerChild: Int!
  " Optional, additional non-negative credit for each family "
  creditPerFamily: Int
  " If true, beneficiaries without date of birth count as adults. Otherwise they're ignored "
  treatBeneficiaryWithoutDobAsAdult: Boolean
  " Additional notes about why credit was adjusted "
  description: String
}

input TransferAgreementCreationInput {
  initiatingOrganisationId: Int!
  partnerOrganisationId: Int!
  type: TransferAgreementType!
  " Validity dates must be in local time "
  validFrom: Date
  validUntil: Date
  initiatingOrganisationBaseIds: [Int!]!
  partnerOrganisationBaseIds: [Int!]
  comment: String
}

input ShipmentCreationInput {
  sourceBaseId: Int!
  targetBaseId: Int!
  " Passing null will create an intra-org shipment "
  transferAgreementId: Int
}

input BoxesShipmentAddInput {
  id: ID!
  " Specify either label identifiers OR filters to find boxes to add "
  labelIdentifiers: [String!]
  filters: FilterBoxInput
}

input ShipmentWhenReceivingUpdateInput {
  id: ID!
  # label identifiers of received boxes to be moved into target stock
  receivedShipmentDetailUpdateInputs: [ShipmentDetailUpdateInput!]
  # label identifiers of boxes that went lost during shipment
  lostBoxLabelIdentifiers: [String!]
}

input ShipmentDetailUpdateInput {
  id: ID!
  targetProductId: Int!
  targetLocationId: Int!
  targetSizeId: Int!
  targetQuantity: Int!
}

input TagCreationInput {
  name: String!
  description: String
  color: String!
  type: TagType!
  baseId: Int!
}

input TagUpdateInput {
  id: ID!
  name: String
  description: String
  color: String
  type: TagType
}

input LinkCreationInput {
  baseId: Int!
  " By default, the link will expire after one week. If no timezone-offset information is passed (via +XX:XX suffix), the time is assumed to be in UTC "
  validUntil: Datetime
  urlParameters: String
  view: ShareableView!
}
